<div class="payment-method" data-bind="css: {'_active': (getCode() == isChecked())}">
  <div class="payment-method-title field choice">
    <input type="radio"
           name="payment[method]"
           class="radio"
           data-bind="attr: {'id': getCode()}, value: getCode(), checked: isChecked, click: selectPaymentMethod, visible: isRadioButtonVisible()">
    <label data-bind="attr: {'for': getCode()}" class="label">
      <span data-bind="text: getTitle()"></span>
    </label>
  </div>
  <div class="payment-method-content">

    <div class="payment-method-billing-address" data-bind="foreach: $parent.getRegion(getBillingAddressFormName())">
      <div data-bind="template: getTemplate()"></div>
    </div>

    <form class="form" data-bind="attr: {'id': getCode() + '-form'}">
      <div class="field number required">
        <label data-bind="attr: {for: getCode() + '_cpf'}" class="label">
          <span data-bind="i18n: 'CPF/CNPJ'"></span>
        </label>
        <div class="control">
          <input type="text"
                 name="payment[boleto_cpf]"
                 class="input-text cpf"
                 maxlength="18"
                 data-bind="attr: {
                                         autocomplete: 'off',
                                         id: getCode() + '_cpf',
                                         title: $t('CPF/CNPJ'),
                                         'data-container': getCode() + '-cpf',
                                         'data-validate': JSON.stringify({'required-entry': true})
                                      },
                                      value: cpfCnpj,
                                      valueUpdate: 'keyup'">
        </div>
        <span id="card-boleto-cpf-msg"></span>
      </div>
    </form>

    <div class="checkout-agreements-block">
    </div>

    <div class="actions-toolbar">
      <div class="primary">
        <button id="place-order-boleto"
                class="action primary checkout"
                type="submit"
                data-bind="
                            click: placeOrder,
                            attr: {title: $t('Place Order')},
                            css: {disabled: !isPlaceOrderActionAllowed()},
                            enable: (getCode() == isChecked())
                        " disabled>
          <span data-bind="i18n: 'Place Order'"></span>
        </button>
      </div>
    </div>
  </div>
</div>
